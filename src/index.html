<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    
    <aside class="sidebar">
      <h1 class="logo">Spotify</h1>

      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Search</a></li>
          <li><a href="#">Your Library</a></li>
        </ul>
      </nav>
    </aside>

    
    <main class="main-content">
      <header class="top-bar">
        <h2>Good Afternoon</h2>
      </header>

      
      <section class="playlist-section">
        <h3>Recently Played</h3>

        <ul class="playlist-grid">
          <li class="playlist-card">Playlist 1</li>
          <li class="playlist-card">Playlist 2</li>
          <li class="playlist-card">Playlist 3</li>
          <li class="playlist-card">Playlist 4</li>
          <li class="playlist-card">Playlist 5</li>
          <li class="playlist-card">Playlist 6</li>
        </ul>
      </section>
    </main>

    
    <footer class="player">
      <p>Now Playing: Song Title</p>
      <div class="controls">
        <button>⏮</button>
        <button>⏯</button>
        <button>⏭</button>
      </div>
    </footer>
  </body>
</html>
